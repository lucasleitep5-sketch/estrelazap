// Componente de Autenticação (Login / Cadastro)
function AuthScreen({ onAuthSuccess, onSkipDemo }) {
  const [tab, setTab] = useState('login'); // 'login' | 'cadastro'
  const [email, setEmail] = useState('');
  const [senha, setSenha] = useState('');
  const [empresa, setEmpresa] = useState('');
  const [whatsapp, setWhatsapp] = useState('');
  const [loading, setLoading] = useState(false);
  const [msg, setMsg] = useState(null);

  const handleSubmit = async (e) => {
    e.preventDefault();
    if (!supabaseClient) {
      setMsg({ type: 'error', text: 'Supabase não inicializado.' });
      return;
    }
    setLoading(true);
    setMsg(null);

    if (tab === 'login') {
      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email.trim(),
        password: senha
      });
      setLoading(false);
      if (error) {
        setMsg({ type: 'error', text: error.message === 'Invalid login credentials' ? 'E-mail ou senha incorretos.' : error.message });
      } else {
        onAuthSuccess(data.user, data.session);
      }
    } else {
      if (!empresa.trim()) {
        setLoading(false);
        setMsg({ type: 'error', text: 'Informe o nome da sua empresa.' });
        return;
      }
      const { data, error } = await supabaseClient.auth.signUp({
        email: email.trim(),
        password: senha,
        options: {
          data: {
            nome_empresa: empresa.trim(),
            whatsapp: whatsapp.trim()
          }
        }
      });
      setLoading(false);
      if (error) {
        setMsg({ type: 'error', text: error.message });
      } else {
        // Criar registro na tabela empresas
        if (data.user) {
          try {
            await supabaseClient.from('empresas').insert([{
              user_id: data.user.id,
              nome_empresa: empresa.trim(),
              whatsapp_empresa: whatsapp.trim(),
              plano: 'pro',
              status_assinatura: 'ativo'
            }]);
          } catch(err) { console.warn(err); }
          onAuthSuccess(data.user, data.session);
        } else {
          setMsg({ type: 'ok', text: 'Conta criada! Verifique seu e-mail para confirmar seu cadastro.' });
        }
      }
    }
  };

    <div className="min-h-screen flex items-center justify-center p-4 sm:p-6 relative overflow-hidden">

          {/* Tabs */}

        </p>

};

const FakeQR = ({ seed = 7, size = 180 }) => {
  const n = 25; let s = seed + 1; const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  const cells = [];
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const finder = (x < 7 && y < 7) || (x >= n - 7 && y < 7) || (x < 7 && y >= n - 7);
    let on;
    if (finder) { const fx = x < 7 ? x : x - (n - 7); const fy = y < 7 ? y : y - (n - 7); on = fx === 0 || fx === 6 || fy === 0 || fy === 6 || (fx >= 2 && fx <= 4 && fy >= 2 && fy <= 4); }
    else on = rnd() > 0.52;
    if (on) cells.push(<rect key={x + '-' + y} x={x} y={y} width="1" height="1" />);
  }
  return <svg viewBox={`0 0 ${n} ${n}`} width={size} height={size} className="fill-slate-900 bg-white rounded-lg p-1" shapeRendering="crispEdges">{cells}</svg>;
};

      <div className="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-5 gap-4">

      <div className="grid lg:grid-cols-5 gap-6">

                <span className="w-8 font-semibold text-slate-700 flex items-center gap-1">{d.n}<Icon name="Star" size={12} className="text-amber-400 fill-amber-400" /></span>
                <div className="flex-1 h-3 rounded-full bg-slate-100 overflow-hidden"><div className={cx('h-full rounded-full transition-all duration-700', d.n >= 4 ? 'bg-emerald-500' : d.n === 3 ? 'bg-amber-400' : 'bg-red-500')} style={{ width: `${(d.c / maxC) * 100}%` }} /></div>

              <div className="rounded-xl bg-emerald-50 p-3"><p className="text-xl font-bold text-emerald-700">{respondidos.length ? Math.round(google / respondidos.length * 100) : 0}%</p><p className="text-xs text-emerald-700">vão para o Google</p></div>

/* ---------------- DISPARAR ---------------- */
function Disparar({ reviews, setReviews, settings, push, go }) {
  const [modo, setModo] = useState('individual');
  const [form, setForm] = useState({ nome: '', fone: '', obs: '' });
  const [erros, setErros] = useState({});
  const [enviando, setEnviando] = useState(false);
  const [lista, setLista] = useState([]);
  const [drag, setDrag] = useState(false);
  const [lote, setLote] = useState(null);
  const fileRef = useRef(null);
  const timers = useRef([]);
  useEffect(() => () => timers.current.forEach(clearTimeout), []);

  const criar = (nome, fone, obs, delay = 1400) => {
    const id = uid();
    setReviews(r => [{ id, cliente: nome.trim(), whatsapp: maskPhone(fone), nota: null, comentario: '', obs, status: 'pendente', data: new Date().toISOString() }, ...r]);
    timers.current.push(setTimeout(() => setReviews(r => r.map(x => x.id === id ? { ...x, status: 'enviado' } : x)), delay));
    return id;
  };
  const enviarIndividual = (e) => {
    e.preventDefault();
    const er = {};
    if (form.nome.trim().length < 2) er.nome = 'Informe o nome do cliente';
    if (!isValidPhone(form.fone)) er.fone = 'WhatsApp inválido — use (XX) 9XXXX-XXXX';
    setErros(er); if (Object.keys(er).length) return;
    setEnviando(true);
    setTimeout(() => { criar(form.nome, form.fone, form.obs); setEnviando(false); push(`Pedido de avaliação enviado para ${form.nome.split(' ')[0]} ✓`, 'success'); setForm({ nome: '', fone: '', obs: '' }); }, 900);
  };
  const parseCSV = (text) => {
    const linhas = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    if (!linhas.length) return [];
    const sep = linhas[0].includes(';') ? ';' : ',';
    const rows = linhas.map(l => l.split(sep).map(c => c.replace(/^"|"$/g, '').trim()));
    if (/nome|telefone|whatsapp|celular/i.test(rows[0].join(' '))) rows.shift();
    return rows.filter(r => r[0]).map(r => ({ id: uid(), nome: r[0], fone: maskPhone(r[1] || ''), obs: r[2] || '', ok: isValidPhone(r[1] || '') }));
  };
  const carregarArquivo = (file) => {
    if (!file) return;
    if (!/\.(csv|txt|xlsx|xls)$/i.test(file.name)) { push('Formato não suportado. Use CSV (ou exporte seu Excel como CSV).', 'error'); return; }
    if (/\.xlsx?$/i.test(file.name)) { push('Para planilhas Excel, salve como CSV (Arquivo → Salvar como → CSV). Carregando lista de exemplo.', 'warning'); setLista(exemplo()); return; }
    const rd = new FileReader(); rd.onload = () => { const l = parseCSV(rd.result); setLista(l); push(`${l.length} contatos carregados (${l.filter(x => x.ok).length} válidos)`, 'info'); }; rd.readAsText(file, 'utf-8');
  };
  const exemplo = () => ['Helena Duarte', 'Paulo Henrique Braga', 'Cristiane Melo', 'Vitor Assunção', 'Daniela Fontes', 'Márcio Tavares', 'Simone Queiroz', 'Otávio Rezende'].map((n, i) => ({ id: uid(), nome: n, fone: maskPhone('1197' + String(3000 + i * 421).slice(-4) + String(5000 + i * 733).slice(-4)), obs: ['Consulta', 'Limpeza', 'Retorno', 'Clareamento'][i % 4], ok: true }));
  const dispararLote = () => {
    const validos = lista.filter(x => x.ok); if (!validos.length) return;
    setLote({ total: validos.length, feito: 0 });
    validos.forEach((c, i) => { timers.current.push(setTimeout(() => { criar(c.nome, c.fone, c.obs, 900); setLote(l => l && { ...l, feito: i + 1 }); if (i === validos.length - 1) { setTimeout(() => { setLote(null); setLista([]); push(`Lote concluído: ${validos.length} pedidos de avaliação enviados 🚀`, 'success'); }, 600); } }, 700 * i)); });
  };
  const feed = [...reviews].sort((a, b) => new Date(b.data) - new Date(a.data)).slice(0, 8);
  return (
    <div className="grid lg:grid-cols-5 gap-6 fade-up">
      <div className="lg:col-span-3 space-y-6">
        {settings.whatsappStatus !== 'conectado' && <div className="flex items-center gap-3 rounded-xl border border-amber-200 bg-amber-50 text-amber-800 px-4 py-3 text-sm"><Icon name="WifiOff" size={18} /><span className="flex-1">WhatsApp desconectado — os disparos abaixo serão <b>simulados</b>.</span><Button size="sm" variant="secondary" onClick={() => go('config')}>Conectar</Button></div>}
        <Card>
          <div className="p-2 border-b border-slate-100 flex gap-1 bg-slate-50/60 rounded-t-2xl">
            {[['individual', 'Envio individual rápido', 'UserPlus'], ['massa', 'Importação em massa', 'FileSpreadsheet']].map(([id, label, ic]) => <button key={id} onClick={() => setModo(id)} className={cx('flex-1 flex items-center justify-center gap-2 rounded-xl px-3 py-2.5 text-sm font-medium transition', modo === id ? 'bg-white shadow-sm text-blue-700' : 'text-slate-600 hover:bg-white/60')}><Icon name={ic} size={16} />{label}</button>)}
          </div>
          {modo === 'individual' ? (
            <form onSubmit={enviarIndividual} className="p-5 space-y-4">
              <div className="grid sm:grid-cols-2 gap-4">
                <Input label="Nome do cliente" placeholder="Ex.: Fernanda Lima" value={form.nome} onChange={e => setForm({ ...form, nome: e.target.value })} error={erros.nome} />
                <Input label="WhatsApp" placeholder="(11) 98888-7777" inputMode="numeric" value={form.fone} onChange={e => setForm({ ...form, fone: maskPhone(e.target.value) })} error={erros.fone} />
              </div>
              <Input label="Observação / atendimento (opcional)" placeholder="Ex.: Limpeza com Dra. Carla" value={form.obs} onChange={e => setForm({ ...form, obs: e.target.value })} />
              <div className="rounded-xl bg-slate-50 border border-slate-100 p-4 text-sm text-slate-600">
                <p className="font-medium text-slate-700 mb-1 flex items-center gap-2"><Icon name="Eye" size={14} />Prévia da mensagem</p>
                <p className="whitespace-pre-wrap">{fill(settings.templates.abordagem, { nome_cliente: form.nome.split(' ')[0] || '[Nome]', nome_empresa: settings.empresa, link_google: settings.googleLink })}</p>
              </div>
              <Button type="submit" size="lg" className="w-full" icon="Send" loading={enviando}>{enviando ? 'Enviando…' : 'Disparar agora'}</Button>
            </form>
          ) : (
            <div className="p-5 space-y-4">
              <div onDragOver={e => { e.preventDefault(); setDrag(true); }} onDragLeave={() => setDrag(false)} onDrop={e => { e.preventDefault(); setDrag(false); carregarArquivo(e.dataTransfer.files[0]); }} onClick={() => fileRef.current.click()}
                className={cx('rounded-2xl border-2 border-dashed p-8 text-center cursor-pointer transition', drag ? 'border-blue-500 bg-blue-50' : 'border-slate-300 hover:border-blue-400 hover:bg-slate-50')}>
                <input ref={fileRef} type="file" accept=".csv,.txt,.xlsx,.xls" className="hidden" onChange={e => carregarArquivo(e.target.files[0])} />
                <div className="w-12 h-12 mx-auto rounded-xl bg-blue-50 text-blue-600 grid place-items-center mb-3"><Icon name="Upload" size={22} /></div>
                <p className="font-medium text-slate-800">Arraste sua planilha aqui ou clique para selecionar</p>
                <p className="text-sm text-slate-500 mt-1">CSV com as colunas: <code className="bg-slate-100 px-1 rounded">nome;telefone;observacao</code></p>
              </div>
              <div className="flex flex-wrap gap-2">
                <Button variant="secondary" size="sm" icon="Download" onClick={() => downloadCSV('modelo-estrelazap.csv', [['nome', 'telefone', 'observacao'], ['Fernanda Lima', '11988887777', 'Limpeza'], ['Carlos Souza', '11977776666', 'Consulta']])}>Baixar modelo CSV</Button>
                <Button variant="secondary" size="sm" icon="Sparkles" onClick={() => { setLista(exemplo()); push('Lista de exemplo carregada', 'info'); }}>Carregar lista de exemplo</Button>
                {lista.length > 0 && <Button variant="ghost" size="sm" icon="Trash2" onClick={() => setLista([])}>Limpar</Button>}
              </div>
              {lista.length > 0 && (
                <div className="rounded-xl border border-slate-200 overflow-hidden">
                  <div className="max-h-64 overflow-auto"><table className="w-full text-sm"><thead className="bg-slate-50 text-slate-600 text-xs uppercase sticky top-0"><tr><th className="text-left px-4 py-2">Nome</th><th className="text-left px-4 py-2">WhatsApp</th><th className="text-left px-4 py-2 hidden sm:table-cell">Obs.</th><th className="px-4 py-2">Válido</th></tr></thead>
                    <tbody className="divide-y divide-slate-100">{lista.map(c => <tr key={c.id} className={!c.ok ? 'bg-red-50/50' : ''}><td className="px-4 py-2 font-medium">{c.nome}</td><td className="px-4 py-2">{c.fone || '—'}</td><td className="px-4 py-2 hidden sm:table-cell text-slate-500">{c.obs}</td><td className="px-4 py-2 text-center">{c.ok ? <Icon name="CheckCircle2" size={16} className="text-emerald-600 inline" /> : <Icon name="AlertTriangle" size={16} className="text-red-500 inline" />}</td></tr>)}</tbody></table></div>
                  <div className="p-4 bg-slate-50 border-t border-slate-200">
                    {lote ? <div><div className="flex justify-between text-sm mb-1"><span className="font-medium">Enviando com delay inteligente (anti-bloqueio)…</span><span>{lote.feito}/{lote.total}</span></div><div className="h-2 rounded-full bg-slate-200 overflow-hidden"><div className="h-full bg-blue-600 transition-all" style={{ width: `${lote.feito / lote.total * 100}%` }} /></div></div>
                      : <Button className="w-full" icon="Rocket" onClick={dispararLote} disabled={!lista.some(x => x.ok)}>Disparar {lista.filter(x => x.ok).length} pedidos em lote</Button>}
                  </div>
                </div>
              )}
            </div>
          )}
        </Card>
      </div>
      <Card className="lg:col-span-2 self-start">
        <CardHeader title="Disparos recentes" sub="Status em tempo real" icon="Activity" />
        <ul className="divide-y divide-slate-100">
          {feed.map(r => (
            <li key={r.id} className="px-5 py-3 flex items-center gap-3 fade-up">
              <div className={cx('w-2.5 h-2.5 rounded-full shrink-0', r.status === 'pendente' ? 'bg-slate-300 animate-pulse' : r.status === 'enviado' ? 'bg-blue-500 animate-pulse' : r.status === 'google' ? 'bg-emerald-500' : r.status === 'retido' ? 'bg-red-500' : 'bg-amber-400')} />
              <div className="flex-1 min-w-0"><p className="text-sm font-medium truncate">{r.cliente}</p><p className="text-xs text-slate-500">{r.whatsapp} · {fmtDate(r.data)}</p></div>
              <StatusBadge status={r.status} />
            </li>
          ))}
        </ul>
        <div className="p-4 text-xs text-slate-500 border-t border-slate-100 flex gap-2"><Icon name="ShieldCheck" size={14} className="shrink-0 mt-0.5 text-emerald-600" />Enviamos com intervalo aleatório de 5 a 15 s entre contatos e apenas para clientes que já foram atendidos — mantendo seu número seguro.</div>
      </Card>
    </div>
  );
}

/* ---------------- SIMULADOR ---------------- */
function Simulador({ reviews, setReviews, settings, push }) {
  const pendentes = reviews.filter(r => !r.nota);
  const [nome, setNome] = useState(pendentes[0]?.cliente || 'Fernanda Lima');
  const [fone, setFone] = useState(pendentes[0]?.whatsapp || '(11) 98455-2210');
  const [msgs, setMsgs] = useState([]);
  const [step, setStep] = useState('idle');
  const [typing, setTyping] = useState(false);
  const [motivo, setMotivo] = useState('');
  const [nota, setNota] = useState(null);
  const [log, setLog] = useState([]);
  const endRef = useRef(null);
  useEffect(() => { endRef.current?.scrollIntoView({ behavior: 'smooth', block: 'end' }); }, [msgs, typing, step]);
  const vars = { nome_cliente: nome.split(' ')[0] || 'cliente', nome_empresa: settings.empresa, link_google: settings.googleLink };
  const addLog = (t, type = 'info') => setLog(l => [{ id: uid(), t, type, hora: new Date().toLocaleTimeString('pt-BR') }, ...l].slice(0, 14));
  const botSay = (text, extra = {}) => new Promise(res => { setTyping(true); setTimeout(() => { setTyping(false); setMsgs(m => [...m, { id: uid(), from: 'bot', text, hora: hhmm(), ...extra }]); res(); }, 1200); });
  const userSay = (text) => setMsgs(m => [...m, { id: uid(), from: 'user', text, hora: hhmm() }]);
  const registrar = (patch) => setReviews(r => { const idx = r.findIndex(x => x.whatsapp === fone && !x.nota); if (idx >= 0) { const c = [...r]; c[idx] = { ...c[idx], ...patch, data: new Date().toISOString() }; return c; } return [{ id: uid(), cliente: nome, whatsapp: fone, comentario: '', obs: 'Simulador', data: new Date().toISOString(), ...patch }, ...r]; });
  const iniciar = async () => { setMsgs([]); setNota(null); setMotivo(''); setLog([]); setStep('enviando'); addLog(`Disparo criado para ${nome} (${fone})`); await botSay(fill(settings.templates.abordagem, vars)); addLog('Mensagem de abordagem entregue ✓✓', 'ok'); setStep('aguardando_nota'); };
  const responderNota = async (n) => {
    setNota(n); userSay(`${'⭐'.repeat(n)} ${n}`); addLog(`Cliente respondeu nota ${n}`); setStep('processando');
    if (n >= 4) { await botSay(fill(settings.templates.positiva, vars), { link: settings.googleLink }); addLog('Nota alta → link do Google enviado ao cliente', 'ok'); registrar({ nota: n, status: 'google' }); push(`Avaliação ${n}⭐ direcionada ao Google! 🎉`, 'success'); setStep('finalizado'); }
    else { await botSay(fill(settings.templates.negativa, vars)); addLog('Nota baixa → link do Google BLOQUEADO', 'warn'); setStep('aguardando_motivo'); }
  };
  const enviarMotivo = async (e) => { e && e.preventDefault(); if (!motivo.trim()) return; userSay(motivo); setStep('processando'); await botSay(fill(settings.templates.agradecimento, vars), { alerta: true }); addLog(`Alerta enviado ao gerente (${settings.gerenteWhatsapp})`, 'warn'); registrar({ nota, status: 'retido', comentario: motivo }); push('Reclamação retida internamente — Google protegido 🔒', 'warning'); setStep('finalizado'); };
  return (
    <div className="grid lg:grid-cols-5 gap-6 fade-up">
      <div className="lg:col-span-2 space-y-4 order-2 lg:order-1">
        <Card>
          <CardHeader title="Contato de teste" sub="Quem vai receber a mensagem?" icon="Smartphone" />
          <div className="p-5 space-y-3">
            {pendentes.length > 0 && <label className="block"><span className="block text-sm font-medium text-slate-700 mb-1.5">Usar um disparo pendente</span><select className="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm bg-white" onChange={e => { const r = pendentes.find(x => x.id === e.target.value); if (r) { setNome(r.cliente); setFone(r.whatsapp); } }} defaultValue=""><option value="">Selecionar…</option>{pendentes.map(r => <option key={r.id} value={r.id}>{r.cliente} · {r.whatsapp}</option>)}</select></label>}
            <Input label="Nome" value={nome} onChange={e => setNome(e.target.value)} />
            <Input label="WhatsApp" value={fone} onChange={e => setFone(maskPhone(e.target.value))} />
            <Button className="w-full" icon={step === 'idle' ? 'Play' : 'RotateCcw'} onClick={iniciar} disabled={step === 'enviando' || step === 'processando'}>{step === 'idle' ? 'Iniciar simulação' : 'Reiniciar simulação'}</Button>
          </div>
        </Card>
        <Card>
          <CardHeader title="Log do sistema" sub="O que o EstrelaZap faz por trás" icon="Terminal" />
          <div className="p-4 bg-slate-900 rounded-b-2xl font-mono text-xs min-h-[140px] max-h-64 overflow-auto space-y-1.5">
            {log.length === 0 && <p className="text-slate-500">// aguardando início da simulação…</p>}
            {log.map(l => <p key={l.id} className={cx('fade-up', l.type === 'ok' ? 'text-emerald-400' : l.type === 'warn' ? 'text-amber-400' : 'text-slate-300')}><span className="text-slate-500">[{l.hora}]</span> {l.t}</p>)}
          </div>
        </Card>
        <div className="grid grid-cols-2 gap-3 text-sm">

/* ---------------- HISTÓRICO ---------------- */
function Historico({ reviews, setReviews, settings, push }) {
  const [filtro, setFiltro] = useState('todos');
  const [q, setQ] = useState('');
  const [pg, setPg] = useState(1);
  const [del, setDel] = useState(null);
  const PER = 8;
  const contagem = { todos: reviews.length, 5: reviews.filter(r => r.nota === 5).length, 4: reviews.filter(r => r.nota === 4).length, neg: reviews.filter(r => r.nota && r.nota <= 3).length, pend: reviews.filter(r => !r.nota).length };
  const lista = useMemo(() => {
    let l = [...reviews].sort((a, b) => new Date(b.data) - new Date(a.data));
    if (filtro === '5') l = l.filter(r => r.nota === 5); else if (filtro === '4') l = l.filter(r => r.nota === 4); else if (filtro === 'neg') l = l.filter(r => r.nota && r.nota <= 3); else if (filtro === 'pend') l = l.filter(r => !r.nota);
    if (q) { const s = q.toLowerCase(); l = l.filter(r => r.cliente.toLowerCase().includes(s) || r.whatsapp.includes(s) || (r.comentario || '').toLowerCase().includes(s)); }
    return l;
  }, [reviews, filtro, q]);
  useEffect(() => setPg(1), [filtro, q]);
  const pages = Math.max(1, Math.ceil(lista.length / PER)); const cur = Math.min(pg, pages); const slice = lista.slice((cur - 1) * PER, cur * PER);
  const resolver = (id) => { setReviews(r => r.map(x => x.id === id ? { ...x, status: 'resolvido' } : x)); push('Caso marcado como resolvido ✓', 'success'); };
  const excluir = () => { setReviews(r => r.filter(x => x.id !== del.id)); push('Registro excluído', 'info'); setDel(null); };
  const waLink = (r) => `https://wa.me/55${onlyDigits(r.whatsapp)}?text=${encodeURIComponent(`Olá ${r.cliente.split(' ')[0]}, aqui é da ${settings.empresa}. Vimos seu retorno e queremos resolver isso para você. Podemos conversar?`)}`;
  const exportar = () => { downloadCSV('estrelazap-historico.csv', [['Data', 'Cliente', 'WhatsApp', 'Nota', 'Comentario', 'Status'], ...lista.map(r => [fmtDate(r.data), r.cliente, r.whatsapp, r.nota ?? '', (r.comentario || '').replace(/;/g, ','), STATUS[r.status][0]])]); push('Arquivo CSV exportado', 'success'); };
  const tabs = [['todos', 'Todos'], ['5', '5 estrelas'], ['4', '4 estrelas'], ['neg', 'Insatisfações (1-3)'], ['pend', 'Aguardando']];
  return (
    <div className="space-y-4 fade-up">
      <Card>
        <div className="p-4 flex flex-col md:flex-row md:items-center gap-3 border-b border-slate-100">
          <div className="flex gap-1 overflow-x-auto pb-1 md:pb-0">{tabs.map(([id, label]) => <button key={id} onClick={() => setFiltro(id)} className={cx('px-3 py-1.5 rounded-lg text-sm font-medium whitespace-nowrap transition flex items-center gap-1.5', filtro === id ? 'bg-slate-900 text-white' : 'text-slate-600 hover:bg-slate-100')}>{label}<span className={cx('text-[10px] px-1.5 rounded-full', filtro === id ? 'bg-white/20' : 'bg-slate-200')}>{contagem[id]}</span></button>)}</div>
          <div className="flex-1" />
          <div className="relative"><Icon name="Search" size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" /><input value={q} onChange={e => setQ(e.target.value)} placeholder="Buscar cliente, telefone…" className="pl-9 pr-3 py-2 rounded-xl border border-slate-200 text-sm w-full md:w-64 outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100" /></div>
          <Button variant="secondary" size="sm" icon="Download" onClick={exportar}>Exportar</Button>
        </div>
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead className="bg-slate-50 text-slate-500 text-xs uppercase tracking-wide"><tr><th className="text-left px-5 py-3">Data/Hora</th><th className="text-left px-5 py-3">Cliente</th><th className="text-left px-5 py-3">WhatsApp</th><th className="text-left px-5 py-3">Nota</th><th className="text-left px-5 py-3">Feedback</th><th className="text-left px-5 py-3">Status</th><th className="text-right px-5 py-3">Ações</th></tr></thead>
            <tbody className="divide-y divide-slate-100">
              {slice.map(r => (
                <tr key={r.id} className={cx('hover:bg-slate-50', r.status === 'retido' && 'bg-red-50/40')}>
                  <td className="px-5 py-3 text-slate-500 whitespace-nowrap">{fmtDate(r.data)}</td>
                  <td className="px-5 py-3 font-medium text-slate-800 whitespace-nowrap">{r.cliente}<p className="text-xs text-slate-400 font-normal">{r.obs}</p></td>
                  <td className="px-5 py-3 whitespace-nowrap">{r.whatsapp}</td>
                  <td className="px-5 py-3">{r.nota ? <Stars n={r.nota} /> : <span className="text-xs text-slate-400">—</span>}</td>
                  <td className="px-5 py-3 text-slate-600 max-w-[260px]"><p className="truncate" title={r.comentario}>{r.comentario || <span className="text-slate-400">Sem comentário</span>}</p></td>
                  <td className="px-5 py-3"><StatusBadge status={r.status} /></td>
                  <td className="px-5 py-3"><div className="flex justify-end gap-1.5">
                    {r.status === 'retido' && <><a href={waLink(r)} target="_blank" rel="noreferrer" className="inline-flex items-center gap-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-medium px-2.5 py-1.5"><Icon name="MessageCircle" size={13} />Falar no WhatsApp</a><Button size="sm" variant="secondary" icon="Check" onClick={() => resolver(r.id)}>Resolvido</Button></>}
                    {r.status === 'google' && <a href={settings.googleLink} target="_blank" rel="noreferrer" className="inline-flex items-center gap-1.5 rounded-lg border border-slate-200 hover:bg-slate-50 text-xs font-medium px-2.5 py-1.5"><Icon name="ExternalLink" size={13} />Ver no Google</a>}
                    <button onClick={() => setDel(r)} className="p-1.5 rounded-lg text-slate-400 hover:text-red-600 hover:bg-red-50"><Icon name="Trash2" size={15} /></button>
                  </div></td>
                </tr>
              ))}
            </tbody>
          </table>
          {slice.length === 0 && <Empty title="Nenhum registro encontrado" sub="Ajuste os filtros ou dispare novos pedidos de avaliação." />}
        </div>
        <div className="p-4 border-t border-slate-100 flex items-center justify-between text-sm text-slate-500">
          <span>Mostrando {slice.length} de {lista.length} registros</span>
          <div className="flex items-center gap-1"><Button size="sm" variant="ghost" icon="ChevronLeft" onClick={() => setPg(p => Math.max(1, p - 1))} disabled={cur === 1} /><span className="px-2 font-medium text-slate-700">{cur} / {pages}</span><Button size="sm" variant="ghost" icon="ChevronRight" onClick={() => setPg(p => Math.min(pages, p + 1))} disabled={cur === pages} /></div>
        </div>
      </Card>
      <Modal open={!!del} onClose={() => setDel(null)} title="Excluir registro?" width="max-w-md">
        <p className="text-sm text-slate-600">Tem certeza que deseja excluir o registro de <b>{del?.cliente}</b>? Esta ação não pode ser desfeita.</p>
        <div className="flex justify-end gap-2 mt-5"><Button variant="secondary" onClick={() => setDel(null)}>Cancelar</Button><Button variant="danger" icon="Trash2" onClick={excluir}>Excluir</Button></div>
      </Modal>
    </div>
  );
}

  const [loading, setLoading] = useState(false);
  const [ok, setOk] = useState(false);
  const [card, setCard] = useState({ num: '', nome: '', val: '', cvv: '' });
  const [copiado, setCopiado] = useState(false);
  const PIX = '00020126580014BR.GOV.BCB.PIX0136estrelazap-pagamentos@asaas.com.br5204000053039865406' + (checkout?.preco || 0) + '.005802BR5910ESTRELAZAP6009SAO PAULO62070503***6304A1B2';
  const abrir = (p) => { setCheckout(p); setMetodo('pix'); setOk(false); setLoading(false); setCard({ num: '', nome: '', val: '', cvv: '' }); };
  const confirmar = () => { if (metodo === 'cartao' && (onlyDigits(card.num).length < 16 || !card.nome || card.val.length < 5 || card.cvv.length < 3)) { push('Preencha os dados do cartão corretamente', 'error'); return; } setLoading(true); setTimeout(() => { setLoading(false); setOk(true); setPlan(checkout.id); push(`Plano ${checkout.nome} ativado com sucesso! 🎉`, 'success'); }, 1800); };
  const copiar = async () => { try { await navigator.clipboard.writeText(PIX); } catch (e) { } setCopiado(true); push('Código PIX copiado', 'info'); setTimeout(() => setCopiado(false), 2000); };
  const hoje = new Date(); const fat = [0, 1, 2].map(i => { const d = new Date(hoje.getFullYear(), hoje.getMonth() - i, 5); return { id: 'FAT-' + (2031 - i), data: d.toLocaleDateString('pt-BR'), valor: PLANOS.find(p => p.id === plan)?.preco || 0, status: i === 0 ? 'Paga · PIX' : 'Paga · Cartão' }; });
  const prox = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 5).toLocaleDateString('pt-BR');
  const ordem = ['start', 'pro', 'multi'];
  return (
    <div className="space-y-6 fade-up">
      <div className="text-center max-w-2xl mx-auto"><h2 className="text-2xl font-bold text-slate-900">Escolha o plano ideal para o seu negócio</h2><p className="text-slate-500 mt-2">Sem fidelidade. Cancele quando quiser. Pagamento via PIX ou cartão de crédito com renovação automática.</p></div>
      <div className="grid md:grid-cols-3 gap-5 items-stretch">
        {PLANOS.map(p => { const atual = p.id === plan; const up = ordem.indexOf(p.id) > ordem.indexOf(plan); return (
          <Card key={p.id} className={cx('p-6 flex flex-col relative transition hover:shadow-lg', p.popular && 'border-blue-600 ring-4 ring-blue-100', atual && 'bg-slate-50')}>
            {p.popular && <span className="absolute -top-3 left-1/2 -translate-x-1/2 bg-blue-600 text-white text-xs font-semibold px-3 py-1 rounded-full shadow">⚡ Mais popular</span>}
            <div className="flex items-center justify-between"><h3 className="text-lg font-bold text-slate-900">{p.nome}</h3>{atual && <Badge className="bg-emerald-50 text-emerald-700"><Icon name="BadgeCheck" size={12} />Plano atual</Badge>}</div>
            <p className="text-sm text-slate-500 mt-1 min-h-[40px]">{p.desc}</p>
            <p className="mt-4"><span className="text-4xl font-extrabold text-slate-900">{brl(p.preco)}</span><span className="text-slate-500 text-sm"> /mês</span></p>
            <ul className="mt-5 space-y-2.5 text-sm flex-1">{p.itens.map(i => <li key={i} className="flex items-start gap-2 text-slate-700"><Icon name="Check" size={16} className="text-emerald-600 mt-0.5 shrink-0" />{i}</li>)}</ul>
            <Button className="mt-6 w-full" variant={atual ? 'secondary' : p.popular ? 'primary' : 'dark'} disabled={atual} onClick={() => abrir(p)} icon={atual ? 'Check' : up ? 'ArrowUpRight' : 'ArrowDownRight'}>{atual ? 'Plano ativo' : up ? 'Fazer upgrade' : 'Mudar para este plano'}</Button>
          </Card>); })}
      </div>
      <Card>
        <CardHeader title="Faturas" sub={`Próxima cobrança em ${prox}`} icon="Receipt" />
        <div className="overflow-x-auto w-full">
          <table className="w-full text-sm min-w-[500px]"><thead className="bg-slate-50 text-slate-500 text-xs uppercase"><tr><th className="text-left px-5 py-3">Fatura</th><th className="text-left px-5 py-3">Data</th><th className="text-left px-5 py-3">Valor</th><th className="text-left px-5 py-3">Status</th><th className="px-5 py-3"></th></tr></thead>
          <tbody className="divide-y divide-slate-100">{fat.map(f => <tr key={f.id}><td className="px-5 py-3 font-medium">{f.id}</td><td className="px-5 py-3 text-slate-500">{f.data}</td><td className="px-5 py-3">{brl(f.valor)}</td><td className="px-5 py-3"><Badge className="bg-emerald-50 text-emerald-700"><Icon name="CheckCircle2" size={12} />{f.status}</Badge></td><td className="px-5 py-3 text-right"><button onClick={() => push('Download da fatura iniciado', 'info')} className="text-blue-600 hover:underline text-xs inline-flex items-center gap-1"><Icon name="Download" size={13} />PDF</button></td></tr>)}</tbody></table>
        </div>
      </Card>
      <Modal open={!!checkout} onClose={() => setCheckout(null)} title={ok ? 'Pagamento confirmado' : `Assinar plano ${checkout?.nome}`} width="max-w-md">
        {checkout && (ok ? (
          <div className="text-center py-4 pop"><div className="w-16 h-16 mx-auto rounded-full bg-emerald-50 text-emerald-600 grid place-items-center mb-3"><Icon name="CheckCircle2" size={32} /></div><p className="font-semibold text-slate-900 text-lg">Plano {checkout.nome} ativado!</p><p className="text-sm text-slate-500 mt-1">Cobrança de {brl(checkout.preco)} processada. Recibo enviado por e-mail.</p><Button className="mt-5" onClick={() => setCheckout(null)}>Começar a usar</Button></div>
        ) : (
          <div className="space-y-4">
            <div className="flex items-center justify-between rounded-xl bg-slate-50 border border-slate-200 p-3"><div><p className="text-sm font-medium">EstrelaZap {checkout.nome}</p><p className="text-xs text-slate-500">Renovação mensal automática</p></div><p className="font-bold text-slate-900">{brl(checkout.preco)}</p></div>
            <div className="grid grid-cols-2 gap-2 p-1 bg-slate-100 rounded-xl">{[['pix', 'PIX', 'QrCode'], ['cartao', 'Cartão de crédito', 'CreditCard']].map(([id, l, ic]) => <button key={id} onClick={() => setMetodo(id)} className={cx('flex items-center justify-center gap-2 rounded-lg py-2 text-sm font-medium transition', metodo === id ? 'bg-white shadow-sm text-blue-700' : 'text-slate-600')}><Icon name={ic} size={16} />{l}</button>)}</div>
            {metodo === 'pix' ? (
              <div className="text-center space-y-3"><div className="inline-block border border-slate-200 rounded-xl p-2"><FakeQR seed={checkout.preco} size={170} /></div><p className="text-xs text-slate-500">Escaneie com o app do seu banco ou copie o código:</p><div className="flex gap-2"><input readOnly value={PIX} className="flex-1 text-xs rounded-lg border border-slate-200 px-3 py-2 bg-slate-50 font-mono truncate" /><Button size="sm" variant="secondary" icon={copiado ? 'Check' : 'Copy'} onClick={copiar}>{copiado ? 'Copiado' : 'Copiar'}</Button></div><p className="text-xs text-emerald-700 flex items-center justify-center gap-1"><Icon name="Zap" size={12} />Liberação imediata após o pagamento</p></div>
            ) : (
              <div className="space-y-3">
                <Input label="Número do cartão" placeholder="0000 0000 0000 0000" inputMode="numeric" value={card.num} onChange={e => setCard({ ...card, num: onlyDigits(e.target.value).slice(0, 16).replace(/(\d{4})(?=\d)/g, '$1 ') })} />
                <Input label="Nome impresso no cartão" placeholder="LUCAS S LEITE" value={card.nome} onChange={e => setCard({ ...card, nome: e.target.value.toUpperCase() })} />
                <div className="grid grid-cols-2 gap-3"><Input label="Validade" placeholder="MM/AA" value={card.val} onChange={e => setCard({ ...card, val: onlyDigits(e.target.value).slice(0, 4).replace(/(\d{2})(?=\d)/, '$1/') })} /><Input label="CVV" placeholder="123" value={card.cvv} onChange={e => setCard({ ...card, cvv: onlyDigits(e.target.value).slice(0, 4) })} /></div>
              </div>
            )}
            <Button className="w-full" size="lg" loading={loading} icon="Lock" onClick={confirmar}>{loading ? 'Processando pagamento…' : metodo === 'pix' ? 'Já fiz o pagamento' : `Pagar ${brl(checkout.preco)}`}</Button>
            <p className="text-[11px] text-slate-400 text-center flex items-center justify-center gap-1"><Icon name="ShieldCheck" size={12} />Pagamento seguro processado via Asaas · Cancele quando quiser</p>
          </div>
        ))}
      </Modal>
    </div>
  );
}

/* ---------------- APP ---------------- */
function App() {
  const [session, setSession] = useState(null);
  const [currentUser, setCurrentUser] = useState(null);
  const [authChecked, setAuthChecked] = useState(false);
  const [skipAuth, setSkipAuth] = useState(false);

  useEffect(() => {
    if (supabaseClient) {
      supabaseClient.auth.getSession().then(({ data: { session } }) => {
        setSession(session);
        setCurrentUser(session?.user || null);
        setAuthChecked(true);
      });
      const { data: { subscription } } = supabaseClient.auth.onAuthStateChange((_event, session) => {
        setSession(session);
        setCurrentUser(session?.user || null);
      });
      return () => subscription.unsubscribe();
    } else {
      setAuthChecked(true);
    }
  }, []);

  const handleLogout = async () => {
    if (supabaseClient) await supabaseClient.auth.signOut();
    setSession(null);
    setCurrentUser(null);
    setSkipAuth(false);
  };
  const [state, setState] = useState(() => { try { const s = JSON.parse(localStorage.getItem(STORAGE_KEY)); if (s && Array.isArray(s.reviews) && s.settings?.templates) return s; } catch (e) { } return { settings: DEFAULT_SETTINGS, reviews: seedReviews(), plan: 'pro' }; });
  useEffect(() => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { } }, [state]);
  const [page, setPage] = useState('dashboard');
  const [menu, setMenu] = useState(false);
  const [toasts, setToasts] = useState([]);
  const push = useCallback((msg, type = 'success') => { const id = uid(); setToasts(t => [...t, { id, msg, type }]); setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3800); }, []);
  const setSettings = (patch) => setState(s => ({ ...s, settings: { ...s.settings, ...patch } }));
  const setReviews = (fn) => setState(s => ({ ...s, reviews: typeof fn === 'function' ? fn(s.reviews) : fn }));
  const setPlan = (p) => setState(s => ({ ...s, plan: p }));
  const go = (p) => { setPage(p); setMenu(false); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  const reset = () => { setState({ settings: DEFAULT_SETTINGS, reviews: seedReviews(), plan: 'pro' }); push('Dados de demonstração restaurados', 'info'); };
  const alertas = state.reviews.filter(r => r.status === 'retido').length;
  const titulo = NAV.find(n => n.id === page)?.label;
    const { settings, reviews, plan } = state;

  if (!authChecked) {
    return <div className="min-h-screen grid place-items-center bg-slate-50"><div className="w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full animate-spin" /></div>;
  }

  if (!session && !skipAuth) {
    return (
      <AuthScreen
        onAuthSuccess={(u, s) => { setCurrentUser(u); setSession(s); }}
        onSkipDemo={() => setSkipAuth(true)}
      />
    );
  }
  return (
    <div className="min-h-screen flex">
      {menu && <div className="fixed inset-0 bg-slate-900/40 z-30 lg:hidden" onClick={() => setMenu(false)} />}
      <aside className={cx('fixed lg:sticky top-0 h-screen z-40 w-64 bg-slate-900 text-slate-300 flex flex-col transition-transform duration-200 shrink-0', menu ? 'translate-x-0' : '-translate-x-full lg:translate-x-0')}>
        <div className="p-5 flex items-center gap-3 border-b border-white/10">
          <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-400 to-orange-500 grid place-items-center shadow-lg shadow-amber-500/30"><Icon name="Star" size={22} className="text-white fill-white" /></div>
          <div><p className="font-bold text-white text-lg leading-none">EstrelaZap</p><p className="text-[11px] text-slate-400 mt-0.5">Reputação no piloto automático</p></div>
          <button className="ml-auto lg:hidden p-1" onClick={() => setMenu(false)}><Icon name="X" size={18} /></button>
        </div>
        <nav className="p-3 space-y-1 flex-1 overflow-y-auto">
          {NAV.map(n => <button key={n.id} onClick={() => go(n.id)} className={cx('w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition', page === n.id ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/30' : 'hover:bg-white/5 hover:text-white')}><Icon name={n.icon} size={18} />{n.label}{n.hot && page !== n.id && <span className="ml-auto text-[10px] bg-amber-400 text-slate-900 font-bold px-1.5 py-0.5 rounded">DEMO</span>}{n.id === 'historico' && alertas > 0 && <span className="ml-auto text-[10px] bg-red-500 text-white font-bold w-5 h-5 grid place-items-center rounded-full">{alertas}</span>}</button>)}
        </nav>
        <div className="p-3 border-t border-white/10 space-y-2">
          <div className="rounded-xl bg-white/5 p-3 text-xs"><div className="flex items-center gap-2 mb-1"><span className={cx('w-2 h-2 rounded-full', settings.whatsappStatus === 'conectado' ? 'bg-emerald-400' : 'bg-red-400 animate-pulse')} /><span className="font-medium text-white">WhatsApp {settings.whatsappStatus === 'conectado' ? 'conectado' : 'desconectado'}</span></div><p className="text-slate-400 truncate">{settings.empresa}</p></div>
          <button onClick={reset} className="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-xs text-slate-400 hover:text-white hover:bg-white/5"><Icon name="RotateCcw" size={14} />Restaurar dados de demonstração</button>
        </div>
      </aside>
      <div className="flex-1 flex flex-col min-w-0">
        <header className="sticky top-0 z-20 bg-white/80 backdrop-blur border-b border-slate-200 px-4 md:px-8 h-16 flex items-center gap-3">
          <button className="lg:hidden p-2 -ml-2 rounded-lg hover:bg-slate-100" onClick={() => setMenu(true)}><Icon name="Menu" size={20} /></button>
          <h1 className="font-semibold text-slate-900 text-lg">{titulo}</h1>
          <div className="ml-auto flex items-center gap-2">
            <Badge className={cx('hidden sm:inline-flex', PLANOS.find(p => p.id === plan)?.popular ? 'bg-blue-50 text-blue-700' : 'bg-slate-100 text-slate-700')}><Icon name="Crown" size={12} />Plano {PLANOS.find(p => p.id === plan)?.nome}</Badge>
            <button onClick={() => go('historico')} className="relative p-2 rounded-lg hover:bg-slate-100"><Icon name="Bell" size={20} className="text-slate-600" />{alertas > 0 && <span className="absolute top-1 right-1 w-4 h-4 bg-red-500 text-white text-[10px] font-bold rounded-full grid place-items-center">{alertas}</span>}</button>
            <div className="flex items-center gap-2 pl-2 border-l border-slate-200"><div className="w-9 h-9 rounded-full bg-gradient-to-br from-blue-600 to-indigo-600 text-white grid place-items-center text-sm font-bold">LL</div><div className="hidden md:block leading-tight"><p className="text-sm font-medium text-slate-800">Lucas Leite</p><p className="text-[11px] text-slate-500">Administrador</p></div></div>
          </div>
        </header>
        <main className="flex-1 p-4 md:p-8 w-full max-w-7xl mx-auto">
          {page === 'dashboard' && <Dashboard reviews={reviews} settings={settings} plan={plan} go={go} />}
          {page === 'disparar' && <Disparar reviews={reviews} setReviews={setReviews} settings={settings} push={push} go={go} />}
          {page === 'simulador' && <Simulador reviews={reviews} setReviews={setReviews} settings={settings} push={push} />}
          {page === 'historico' && <Historico reviews={reviews} setReviews={setReviews} settings={settings} push={push} />}
          {page === 'config' && <Config settings={settings} setSettings={setSettings} push={push} />}
          {page === 'planos' && <Planos plan={plan} setPlan={setPlan} push={push} />}
        </main>
        <footer className="px-8 py-4 text-xs text-slate-400 text-center">EstrelaZap © {new Date().getFullYear()} · Multiplique suas avaliações 5 estrelas no Google pelo WhatsApp · Dados conforme LGPD</footer>
      </div>
      <Toasts toasts={toasts} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
